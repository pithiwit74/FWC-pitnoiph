<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }
        td {
            border: 1px solid black;
            height: 150px;
            padding: 15px;
            vertical-align: center;
        }
        .first-cell {
            background-color: #39bd95;
            width: 50%;
        }
        .second-cell {
            background-color: #cf52ba;
            width: 50%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
