<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color:pink;
        }
        h1 {
            color:white;
            text-align: center;
        }
        .shops {
            display: flex;
            justify-content: center;
            gap: 150px;
            text-align: center;
        }
        .shop-item img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }
        .copyright {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Online Shops &amp; Deals</h1>

    <div class="shops">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <br>
            <a href="https://www.amazon.com">Amazon</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <br>
            <a href="https://www.ebay.com">eBay</a>
        </div>
    </div>

    <hr>

    <p class="copyright">&copy; pnoiphichai 2026</p>

</body>
</html>
