<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Rush Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Playfair+Display:ital,wght@1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-md portfolio-navbar landing-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#home">Rush Project</a>
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#landingMenu" aria-controls="landingMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="landingMenu">
                <div class="navbar-nav ms-auto">
                    <a href="#home" class="nav-link pill" data-target="home">Home</a>
                    <a href="#profiles" class="nav-link pill" data-target="profiles">Profiles</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="snap-wrap" id="snapWrap">

        <section class="snap-section hero" id="home">
            <h1>Welcome<span class="to">to</span></h1>
            <span class="highlight">Rush Project</span>

            <div class="scroll-cue">
                <div class="chevrons">
                    <svg viewBox="0 0 44 22"><polyline points="2,20 22,4 42,20" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <svg viewBox="0 0 44 22"><polyline points="2,20 22,4 42,20" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <svg viewBox="0 0 44 22"><polyline points="2,20 22,4 42,20" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <p>Slides go to see</p>
            </div>
        </section>

        <section class="snap-section" id="profiles">

            <div class="profiles">

                <a href="biw.html" class="profile-pick">
                    <svg viewBox="0 0 200 220" aria-hidden="true">
                        <ellipse cx="100" cy="205" rx="70" ry="10" fill="#EFEFEF"/>
                        <path d="M40 210 L45 140 Q100 118 155 140 L160 210 Z" fill="var(--blue)"/>
                        <path d="M12 150 Q30 120 55 138 L45 158 Q28 165 12 150 Z" fill="var(--blue)"/>
                        <path d="M188 150 Q170 120 145 138 L155 158 Q172 165 188 150 Z" fill="var(--blue)"/>
                        <circle cx="100" cy="80" r="46" fill="#FBC9A0"/>
                        <path d="M56 78 Q52 26 100 24 Q150 22 146 74 Q140 56 118 52 Q100 66 78 52 Q60 58 56 78Z" fill="#22303F"/>
                        <circle cx="80" cy="82" r="5" fill="#1A1A1A"/>
                        <circle cx="120" cy="82" r="5" fill="#1A1A1A"/>
                        <circle cx="66" cy="96" r="7" fill="#F4A2A2" opacity="0.7"/>
                        <circle cx="134" cy="96" r="7" fill="#F4A2A2" opacity="0.7"/>
                        <path d="M82 104 Q100 118 118 104" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                    <span>BIW's Profile</span>
                </a>

                <a href="nub.html" class="profile-pick">
                    <svg viewBox="0 0 200 220" aria-hidden="true">
                        <ellipse cx="100" cy="205" rx="70" ry="10" fill="#EFEFEF"/>
                        <path d="M40 210 L45 140 Q100 118 155 140 L160 210 Z" fill="var(--pink)"/>
                        <path d="M12 150 Q30 120 55 138 L45 158 Q28 165 12 150 Z" fill="var(--pink)"/>
                        <path d="M188 150 Q170 120 145 138 L155 158 Q172 165 188 150 Z" fill="var(--pink)"/>
                        <path d="M40 92 Q30 140 55 150 Q45 110 55 95 Z" fill="#6B4A3A"/>
                        <path d="M160 92 Q170 140 145 150 Q155 110 145 95 Z" fill="#6B4A3A"/>
                        <circle cx="100" cy="80" r="46" fill="#FBC9A0"/>
                        <path d="M54 76 Q48 24 100 24 Q152 24 146 76 Q120 46 100 52 Q80 46 54 76Z" fill="#6B4A3A"/>
                        <circle cx="80" cy="82" r="5" fill="#1A1A1A"/>
                        <circle cx="120" cy="82" r="5" fill="#1A1A1A"/>
                        <circle cx="66" cy="96" r="7" fill="#F4A2A2" opacity="0.7"/>
                        <circle cx="134" cy="96" r="7" fill="#F4A2A2" opacity="0.7"/>
                        <path d="M82 104 Q100 118 118 104" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                    <span>NUB's Profile</span>
                </a>

            </div>

            <p class="select-caption">Select whose portfolio you want to view</p>

        </section>

    </div>

    <script>
        const wrap = document.getElementById('snapWrap');
        const pills = document.querySelectorAll('.portfolio-navbar .pill');
        const sections = document.querySelectorAll('.snap-section');

        const spy = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting){
                    pills.forEach(p => p.classList.toggle('active', p.dataset.target === entry.target.id));
                }
            });
        }, { root: wrap, threshold: 0.6 });

        sections.forEach(s => spy.observe(s));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
